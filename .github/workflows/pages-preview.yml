name: GitHub Pages test play

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pages preview build
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build static preview with Firebase administrator login
        run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - name: Check game, demo and static-only behavior under the Pages path
        run: npm run test:pages
      - name: Set up Java for administrator permission tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check administrator roles and private save/publish with Firebase emulators
        run: npx --yes firebase-tools@15.34.0 emulators:exec --project demo-hey-rtm --only auth,firestore "npm run test:cloud -- tests/cloud/admin.spec.ts --grep 'keeps the editor|saves drafts privately'"
      - name: Upload Pages site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Pages preview deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy test play site
        id: deployment
        uses: actions/deploy-pages@v4
